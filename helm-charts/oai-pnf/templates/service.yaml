apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "oai-pnf.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: n2
      port: 36412
      targetPort: 36412
      protocol: SCTP
    - name: n3
      port: 2152
      targetPort: 2152
      protocol: UDP
    - name: f1
      port: 2153
      targetPort: 2153
      protocol: UDP
    - name: nfapi-p5
      port: 50000
      targetPort: 50000
      protocol: SCTP
    - name: nfapi-p7
      port: 50010
      targetPort: 50010
      protocol: UDP
    - name: rfsim
      port: 4043
      targetPort: 4043
      protocol: TCP
  selector:
    {{- include "oai-pnf.selectorLabels" . | nindent 4 }}
