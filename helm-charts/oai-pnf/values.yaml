kubernetesType: Vanilla  #Vanilla for community kubernetes distribution else Openshift for Openshift

## In case of using these charts on Openshift then please use UBI images
## To know more about them follow this tutorial https://gitlab.eurecom.fr/oai/cn5g/oai-cn5g-fed/-/tree/master/openshift
nfimage:   # image name either locally present or in a public/private repository
  #repository: docker.io/oaisoftwarealliance/oai-gnb           ## dockerhub oaisoftwarealliance/oai-gnb  
  #version: 2023.w49 # image tag or develop
  repository: bmw.ece.ntust.edu.tw/minghong/oai-gnb
  version: 2026w11 # keep same tag as UE
  # pullPolicy: IfNotPresent or Never or Always
  pullPolicy: IfNotPresent

## good to use when pulling images from docker-hub mention 
imagePullSecrets:
  - name: "regcred"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "oai-pnf-sa"

# These helm-charts can be used for two purpose
# 1. RFSimulated oai-gNB: Only requires 1 interface for N2 and N3. You can use Kubernetes default interface eth0
# 2. Physical gNB with Ethernet based USRP or RRU: You need to use ruInterface to connect with RU. Make sure that the ip-address you choose can reach to RU.
#                                                 Using a dedicated interface for N2 or N3 is optional you can still use eth0.
# 3. Another thing you can chose to use same virtual interface for N2/N3 its optional to have two different

## NOTE: To use these charts with USRP B210 you need to modify and mount usb from the host.
## Change these ip-addresses according to your environment

multus:
  nfapiInterface:
    create: true
    IPadd: "10.21.8.100"
    # #name inside the pod is hardcoded right now
    # name: "n3"
    Netmask: "22"
    # if gatway is empty then it will be removed
    #Gateway: "172.21.11.254"
    #routes:
    hostInterface: "eno1"      # Interface of the host machine on which this pod will be scheduled
  ruInterface:            #Only needed if using a ethernet based RU/USRP
    create: false
    mtu: 9216
    vlan: 103 #LiteON New 6 LiteON Old, 4
    cPlaneMacAdd: 00:11:22:33:44:66  #vvdn 76:76:64:6e:00:01 #benetel 00:11:22:33:44:67
    uPlaneMacAdd: 00:11:22:33:44:66 #vvdn 76:76:64:6e:00:02 #benetel 00:11:22:33:44:66
    sriovNetworkNamespace: sriov-network-operator
    sriovResourceNameCplane: pci_sriov_net_fh_cp
    sriovResourceNameUplane: pci_sriov_net_fh_up

## If you want to change more configuration parameters then you should mount the config file  
# in templates/configmap.yaml
# Example config files --> https://gitlab.eurecom.fr/oai/openairinterface5g/-/tree/develop/targets/PROJECTS/GENERIC-NR-5GC/CONF 
config:
  mountConfig: false          #If config file is mounted then please edit mount.conf in configmap.yaml properly 
  timeZone: "Europe/Paris"
  #useAdditionalOptions: "--nfapi PNF --rfsim --rfsimulator.serveraddr server --phy-test"
  #useAdditionalOptions: "--sa --rfsim --nfapi PNF" 
  useAdditionalOptions: "--nfapi PNF --rfsim --rfsimulator.serveraddr server --log_config.global_log_options level,nocolor,time"
  #useAdditionalOptions: "--gNBs.[0].min_rxtxtime 6 --continuous-tx --nfapi PNF"

  # If mounting the configuration file then below parameters are not used
  cuName: "oai-pnf"
  mcc: "001"   # check the information with AMF, SMF, UPF
  mnc: "01"    # check the information with AMF, SMF, UPF
  tac: "1"     # check the information with AMF
  sst: "1"  #currently only 4 standard values are allowed 1,2,3,4
  amfhost: "oai-amf"  # amf ip-address or service-name oai-amf-svc or 172.21.6.94
  n2IfName: "eth0"    # if multus.n2Interface.create is true then use n2
  n3IfName: "eth0"   #if multus.n3Interface.create is true then use n3 or you can only use 1 interface n2 or eth0 
  f1IfName: "eth0"   #if multus.f1Interface.create is true then use multus.f1Interface.Ipadd
  vnfIfName: "nfapi"   #if multus.f1Interface.create is true then use multus.f1Interface.Ipadd
  pnfIfName: "f1"   #if multus.f1Interface.create is true then use multus.f1Interface.Ipadd
  f1cuPort: "2153"   #2153 if using same interface for f1 and n3 else standard port 2152 should be use if f1 and n3 interface are different
  f1duPort: "2153"   #2153 if using same interface for f1 and n3 else standard port 2152 should be use if f1 and n3 interface are different # Debugging section
  pnfHost: "10.21.8.100"
  vnfHost: "10.21.8.99"

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0

securityContext:
  privileged: true

start:
  vnf: false #If false the network function container will run in sleep mode for manually testing
  pnf: true #If false the network function container will run in sleep mode for manually testing
  debug: false
  tcpdump: false

includeTcpDumpContainer: false #If true it will add a tcpdump container inside network function pod for debugging

## For openshift you can use rhel8/support-tools:8.7-13
tcpdumpimage:
   repository: docker.io/corfr/tcpdump
   version: latest
   #pullPolicy: IfNotPresent or Never or Always
   pullPolicy: IfNotPresent

## NF is the network function and tcpdump is the tcpdump container. 
## To know more about request and limit it is better to understand that how Kubernetes QoS works. 
## https://kubernetes.io/docs/concepts/configuration/manage-resources-containers
## https://kubernetes.io/docs/concepts/workloads/pods/pod-qos
resources:
  define: false
  limits:
    nf:
      cpu: 100m
      memory: 128Mi
    #If tcpdump container is disabled this value will not be used
    tcpdump:
      cpu: 100m
      memory: 128Mi
  requests:
    nf:
      cpu: 100m
      memory: 128Mi
    #If tcpdump container is disabled this value will not be used
    tcpdump:
      cpu: 100m
      memory: 128Mi


tolerations: []

affinity: {}

terminationGracePeriodSeconds: 5

nodeSelector: {}

nodeName: 
