{{- if .Values.nfapiGnb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: oai-nfapi-svc
  labels:
    app: {{ .Release.Name }}-vnf
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-vnf
  ports:
  - name: nfapi
    port: 2153
    targetPort: 2153
    protocol: UDP
  - name: nfapi-p5
    port: 50001
    targetPort: 50001
    protocol: SCTP
  - name: nfapi-p7
    port: 50011
    targetPort: 50011
    protocol: UDP
{{- end }}

