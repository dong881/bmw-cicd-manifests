{{- if .Values.gnbNfapiPnfRfsim.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnb-nfapi-pnf-rfsim
  labels:
    app: gnb-nfapi-pnf-rfsim
    {{- include "oai-rfsim-e2e.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gnb-nfapi-pnf-rfsim
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gnb-nfapi-pnf-rfsim
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      {{- if .Values.gnbNfapiPnfRfsim.serviceAccount.create }}
      serviceAccountName: {{ .Values.gnbNfapiPnfRfsim.serviceAccount.name }}
      {{- end }}
      containers:
      - name: pnf
        image: "{{ .Values.gnbNfapiPnfRfsim.nfimage.repository }}:{{ .Values.gnbNfapiPnfRfsim.nfimage.version }}"
        imagePullPolicy: {{ .Values.gnbNfapiPnfRfsim.nfimage.pullPolicy }}
        securityContext:
          privileged: true
        volumeMounts:
          - mountPath: /opt/oai-gnb/etc
            name: configuration
        {{- if .Values.gnbNfapiPnfRfsim.resources.define }}
        resources:
          requests:
            cpu: {{ .Values.gnbNfapiPnfRfsim.resources.requests.nf.cpu | quote }}
            memory: {{ .Values.gnbNfapiPnfRfsim.resources.requests.nf.memory | quote }}
          limits:
            cpu: {{ .Values.gnbNfapiPnfRfsim.resources.limits.nf.cpu | quote }}
            memory: {{ .Values.gnbNfapiPnfRfsim.resources.limits.nf.memory | quote }}
        {{- end }}
        ports:
        - containerPort: 36412
          name: n2
          protocol: SCTP
        - containerPort: 2152
          name: n3
          protocol: UDP
        - containerPort: 4043
          name: rfsim
          protocol: TCP
        command: [ "/bin/bash", "-c" ]
        args:
          - |
            PNF_IP_ADDRESS=$(ip -f inet addr show eth0 | grep -o "inet [0-9\.]*" | awk '{print $2}');
            VNF_IP_ADDRESS=$(getent hosts $VNF_HOST | awk '{print $1}');
            VNF_IP_ADDRESS=$(if [[ $VNF_IP_ADDRESS ]]; then echo $VNF_IP_ADDRESS; else echo $VNF_HOST;fi);
            sed -e s/@VNF_IP_ADDRESS@/$VNF_IP_ADDRESS/g \
                -e s/@PNF_IP_ADDRESS@/$PNF_IP_ADDRESS/g \
                /opt/oai-gnb/etc/du.conf | tee /tmp/du.conf;
            exec /opt/oai-gnb/bin/nr-softmodem -O /tmp/du.conf $USE_ADDITIONAL_OPTIONS;
        env:
        - name: TZ
          value: {{ .Values.gnbNfapiPnfRfsim.config.timeZone }}
        - name: USE_ADDITIONAL_OPTIONS
          value: {{ .Values.gnbNfapiPnfRfsim.config.useAdditionalOptions }}
        - name: NFAPI_TRACE_LEVEL
          value: info
        - name: VNF_HOST
          value: {{ .Values.gnbNfapiPnfRfsim.config.nfapiServer.host | quote }}
      volumes:
        - name: configuration
          configMap:
            name: gnb-nfapi-pnf-rfsim-configmap
{{- end }}
