{{- if .Values.gnbNfapiVnf.multus.nfapiInterface.create }}
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Release.Name }}-nfapi
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": {{- cat .Values.gnbNfapiVnf.multus.nfapiInterface.hostInterface | nospace | quote }},
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": {{- cat .Values.gnbNfapiVnf.multus.nfapiInterface.IPadd "/" .Values.gnbNfapiVnf.multus.nfapiInterface.Netmask | nospace | quote }}
          }
        ]
      }
    }'
{{- end }}

