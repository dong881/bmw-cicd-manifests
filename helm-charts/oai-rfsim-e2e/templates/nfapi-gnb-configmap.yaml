{{- if .Values.nfapiGnb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nfapi-gnb-configmap
data:
  du.conf: |
    Active_gNBs = ( "gNB-Eurecom-5GNRBox");
    Asn1_verbosity = "none";

    gNBs =
    (
     {
        gNB_ID    =  0xe00;
        gNB_name  =  "gNB-Eurecom-5GNRBox";

        tracking_area_code  =  1;
        plmn_list = ({ mcc = @MCC@; mnc = @MNC@; mnc_length = 2; snssaiList = ({ sst = @SST@ }) });

        nr_cellid = 12345678L;

        ssb_SubcarrierOffset                                      = 0;
        pdsch_AntennaPorts_N1                                     = 1;
        pusch_AntennaPorts                                        = 1;
        min_rxtxtime                                              = 6;
        enable_sdap                                               = 0;

        pdcch_ConfigSIB1 = (
          {
            controlResourceSetZero = 12;
            searchSpaceZero = 0;
          }
        );

        servingCellConfigCommon = (
        {
          physCellId                                                    = 0;

          absoluteFrequencySSB                                          = 641280;
          dl_frequencyBand                                              = 78;
          dl_absoluteFrequencyPointA                                    = 640008;
          dl_offstToCarrier                                             = 0;
          dl_subcarrierSpacing                                          = 1;
          dl_carrierBandwidth                                           = 106;
          initialDLBWPlocationAndBandwidth                              = 28875;
          initialDLBWPsubcarrierSpacing                                 = 1;
          initialDLBWPcontrolResourceSetZero                            = 12;
          initialDLBWPsearchSpaceZero                                   = 0;

          ul_frequencyBand                                              = 78;
          ul_offstToCarrier                                             = 0;
          ul_subcarrierSpacing                                          = 1;
          ul_carrierBandwidth                                           = 106;
          pMax                                                          = 20;
          initialULBWPlocationAndBandwidth                              = 28875;
          initialULBWPsubcarrierSpacing                                 = 1;

          prach_ConfigurationIndex                                      = 98;
          prach_msg1_FDM                                                = 0;
          prach_msg1_FrequencyStart                                     = 0;
          zeroCorrelationZoneConfig                                     = 13;
          preambleReceivedTargetPower                                   = -96;
          preambleTransMax                                              = 6;
          powerRampingStep                                              = 1;
          ra_ResponseWindow                                             = 5;
          ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                  = 4;
          ssb_perRACH_OccasionAndCB_PreamblesPerSSB                     = 14;
          ra_ContentionResolutionTimer                                  = 7;
          rsrp_ThresholdSSB                                             = 19;
          prach_RootSequenceIndex_PR                                    = 2;
          prach_RootSequenceIndex                                       = 1;
          msg1_SubcarrierSpacing                                        = 1;
          restrictedSetConfig                                           = 0;
          msg3_DeltaPreamble                                            = 1;
          p0_NominalWithGrant                                           = -90;

          pucchGroupHopping                                             = 0;
          hoppingId                                                     = 40;
          p0_nominal                                                    = -90;
          ssb_PositionsInBurst_PR                                       = 2;
          ssb_PositionsInBurst_Bitmap                                   = 1;
          ssb_periodicityServingCell                                    = 2;
          dmrs_TypeA_Position                                           = 0;
          subcarrierSpacing                                             = 1;

          referenceSubcarrierSpacing                                    = 1;
          dl_UL_TransmissionPeriodicity                                 = 6;
          nrofDownlinkSlots                                             = 7;
          nrofDownlinkSymbols                                           = 6;
          nrofUplinkSlots                                               = 2;
          nrofUplinkSymbols                                             = 4;
          ssPBCH_BlockPower                                             = -25;
        }
        );

        SCTP :
        {
            SCTP_INSTREAMS  = 2;
            SCTP_OUTSTREAMS = 2;
        };

        amf_ip_address = ({ ipv4 = "@AMF_IP_ADDRESS@"; preference = "ipv4"; });

        NETWORK_INTERFACES :
        {
            GNB_INTERFACE_NAME_FOR_NG_AMF            = "eth0";
            GNB_IPV4_ADDRESS_FOR_NG_AMF              = "@N2_IP_ADDRESS@";
            GNB_INTERFACE_NAME_FOR_NGU               = "eth0";
            GNB_IPV4_ADDRESS_FOR_NGU                 = "@N3_IP_ADDRESS@";
            GNB_PORT_FOR_S1U                         = 2152;
        };
      }
    );

    MACRLCs = (
      {
        num_cc = 1;
        remote_s_address = "@PNF_IP_ADDRESS@"; // PNF addr
        local_s_address  = "@VNF_IP_ADDRESS@"; // VNF addr
        local_s_portc    = 50001; // VNF P5 port
        remote_s_portc   = 50000; // PNF P5 port
        local_s_portd    = 50011; // VNF P7 port
        remote_s_portd   = 50010; // PNF P7 port
        tr_s_preference  = "nfapi";
        tr_n_preference  = "local_RRC";
        pusch_TargetSNRx10          = 220;
        pucch_TargetSNRx10          = 220;
        ul_bler_target_upper        = .35;
        ul_bler_target_lower        = .15;
        pusch_FailureThres          = 100;
        ul_max_mcs                  = 28;
      }
    )
{{- end }}

